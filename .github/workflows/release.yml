name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-2025-vs2026
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: | 
            10.0.x
            11.0.x

      - uses: nowsprinting/check-version-format-action@313abf385e508f201f555bef71d99afe329a80b5 # v5.0.9
        id: version
        with:
          prefix: 'v'

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: build
        run: msbuild -t:rebuild -restore -p:RestorePackagesConfig=true -property:Configuration=Release NuGetUtility.slnx

      - name: test (NuGetUtility.Test, net11.0)
        run: dotnet test --project ./tests/NuGetUtility.Test/NuGetUtility.Test.csproj --configuration Release -f net11.0 --no-restore --no-build
      - name: test (NuGetLicense.Test, net11.0)
        run: dotnet test --project ./tests/NuGetLicense.Test/NuGetLicense.Test.csproj --configuration Release -f net11.0 --no-restore --no-build
      - name: test (NuGetUtility.Test, net10.0)
        run: dotnet test --project ./tests/NuGetUtility.Test/NuGetUtility.Test.csproj --configuration Release -f net10.0 --no-restore --no-build
      - name: test (NuGetLicense.Test, net10.0)
        run: dotnet test --project ./tests/NuGetLicense.Test/NuGetLicense.Test.csproj --configuration Release -f net10.0 --no-restore --no-build

      - name: fully qualify artifacts path
        id: artifacts_path
        shell: pwsh
        run: |
          $path = [System.IO.Path]::GetFullPath("./artifacts");
          echo "publish to path: $path"
          echo "path=$path" >> $env:GITHUB_OUTPUT

      - name: Publish the application binaries (.net10)
        run: dotnet publish ./src/NuGetLicenseCore/NuGetLicenseCore.csproj -c Release --no-restore -o ${{ steps.artifacts_path.outputs.path }}/net10 -f net10.0 -p:Version=${{ steps.version.outputs.full_without_prefix }} -p:ContinuousIntegrationBuild=true
      - name: Publish the application binaries (.net11)
        run: dotnet publish ./src/NuGetLicenseCore/NuGetLicenseCore.csproj -c Release --no-restore -o ${{ steps.artifacts_path.outputs.path }}/net11 -f net11.0 -p:Version=${{ steps.version.outputs.full_without_prefix }} -p:ContinuousIntegrationBuild=true
      - name: Publish the application binaries (.net472)
        run: msbuild ./src/NuGetLicenseFramework/NuGetLicenseFramework.csproj /t:Publish /p:configuration=Release /p:PublishDir=${{ steps.artifacts_path.outputs.path }}/net472 /p:Version=${{ steps.version.outputs.full_without_prefix }} /p:ContinuousIntegrationBuild=true
      - name: Create nuget package
        run: dotnet pack ./src/NuGetLicenseCore/NuGetLicenseCore.csproj -c Release --no-build -o ${{ steps.artifacts_path.outputs.path }} -p:Version=${{ steps.version.outputs.full_without_prefix }} -p:ContinuousIntegrationBuild=true

      - name: Zip artifacts
        uses: thedoctor0/zip-release@b57d897cb5d60cb78b51a507f63fa184cfe35554 # 0.7.6
        with:
          type: 'zip'
          filename: 'release.zip'
          path: ${{ steps.artifacts_path.outputs.path }}

      - name: Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          prerelease: ${{ steps.version.outputs.prerelease != '' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release.zip
            
      - name: NuGet Login (OIDC)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: sensslen

      - name: publish nuget package to nuget.org
        id: publish_nuget
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "${{ steps.artifacts_path.outputs.path }}" -Include *.nupkg -Recurse
          foreach ($f in $files) {
            $fullPath = $f.FullName
            Write-Host "sending package: $fullPath"
            dotnet nuget push --source 'https://api.nuget.org/v3/index.json' --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate "$fullPath"
          }
